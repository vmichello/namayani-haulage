name: MCP production health

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize production MCP server
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_DEMO_TOKEN: ${{ secrets.MCP_DEMO_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${MCP_DEMO_TOKEN}" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "${MCP_SERVER_URL}/api/mcp")"
          grep -q '"name":"roll_dice"' <<<"$response"
